[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# publish = "." serves the whole repo root, so anything committed here is
# reachable at the site root unless it is blocked. One rule per non-web file
# that still exists; the rest were deleted rather than hidden.
# force = true is required: without it an existing file wins over a redirect.
[[redirects]]
  from = "/supabase-schema.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate_banners.py"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

# The function source lives under /netlify/functions and would otherwise be
# downloadable as plain files. The functions themselves run at
# /.netlify/functions/* (note the dot), which this rule does not touch.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# Belt and braces alongside the noindex meta tag in admin.html: the header
# applies even when a crawler does not parse the HTML.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

# Site icon. Google only shows a favicon in search results if it is square and
# at least 48x48; the old link pointed at the wide 170x120 logo file. These
# rules serve a square, white-backed crop of the same Cloudinary logo from our
# own domain (status 200 = proxy, so the URL stays burmelin.com/...).
# The crop is centred on the mark: the source canvas is 4750x3359 and the mark
# spans x 1599-3028, so a 3359px square starting at x 634 centres it.
[[redirects]]
  from = "/favicon.ico"
  to = "https://res.cloudinary.com/dtpvflgt1/image/upload/c_crop,x_634,y_0,w_3359,h_3359/c_scale,w_48/b_white,f_jpg,q_95/v1773996384/LOGO_q2howi.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/icon-192.jpg"
  to = "https://res.cloudinary.com/dtpvflgt1/image/upload/c_crop,x_634,y_0,w_3359,h_3359/c_scale,w_192/b_white,f_jpg,q_95/v1773996384/LOGO_q2howi.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "https://res.cloudinary.com/dtpvflgt1/image/upload/c_crop,x_634,y_0,w_3359,h_3359/c_scale,w_180/b_white,f_jpg,q_95/v1773996384/LOGO_q2howi.jpg"
  status = 200
  force = true
